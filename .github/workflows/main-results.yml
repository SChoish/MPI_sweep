name: Main experiment tables

on:
  push:
    branches: [main]
    paths:
      - 'sweep_results/**'
      - 'scripts/build_main_results.py'
      - 'scripts/build_log_index.py'
      - 'scripts/publish_iql_results.py'
      - 'scripts/start_iql_results_publisher.sh'
      - 'tests/test_main_results.py'
      - 'tests/test_log_results.py'
      - 'tests/test_publish_iql_results.py'
      - '.github/workflows/main-results.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: main-experiment-tables
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and publish from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # Disposable CI checkout; rebuild if a result publisher wins the push race.
            git reset --hard origin/main
            python -m unittest discover -s tests -p 'test_*results.py'
            python scripts/build_main_results.py
            python scripts/build_log_index.py
            git add -- MAIN_RESULTS.md README.md reports/main_results_audit.json sweep_results/LOG_INDEX.md reports/log_index.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Update main experiment tables'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not publish after five concurrent-update retries' >&2
          exit 1
